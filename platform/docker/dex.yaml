issuer: http://localhost:5556/dex

storage:
  type: sqlite3
  config:
    file: /var/dex/dex.db

web:
  http: 0.0.0.0:5556
  allowedOrigins: ['*']

oauth2:
  skipApprovalScreen: true

staticClients:
  # Platform backend (confidential client)
  - id: tanrenai
    name: Tanrenai Platform
    secret: tanrenai-secret
    redirectURIs:
      - http://localhost:3000/api/auth/callback

  # Frontend (public client, uses PKCE)
  - id: tanrenai-frontend
    name: Tanrenai Frontend
    public: true
    redirectURIs:
      - http://localhost:5173/callback

  # CLI (public client, uses PKCE with localhost callback)
  - id: tanrenai-cli
    name: Tanrenai CLI
    public: true
    redirectURIs:
      - http://localhost:0/callback

enablePasswordDB: true

staticPasswords:
  # Default admin user for development
  - email: admin@tanrenai.local
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W" # password
    username: admin
    userID: admin-001
