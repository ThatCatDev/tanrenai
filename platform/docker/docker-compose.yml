services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tanrenai
      POSTGRES_PASSWORD: tanrenai
      POSTGRES_DB: tanrenai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U tanrenai
      interval: 5s
      timeout: 3s
      retries: 5

  dex:
    image: dexidp/dex:v2.41.1
    command: dex serve /etc/dex/config.yaml
    ports:
      - "5556:5556"
    volumes:
      - ./dex.yaml:/etc/dex/config.yaml:ro
      - dexdata:/var/dex

  platform:
    build:
      context: ../..
      dockerfile: platform/docker/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      dex:
        condition: service_started
    environment:
      DATABASE_URL: postgres://tanrenai:tanrenai@postgres:5432/tanrenai?sslmode=disable
      # Use localhost issuer so tokens validate from both inside docker (via extra_hosts)
      # and outside (browser/CLI). Dex issuer must match token "iss" claim exactly.
      OIDC_ISSUER: http://localhost:5556/dex
      OIDC_CLIENT_ID: tanrenai
      OIDC_CLIENT_SECRET: tanrenai-secret
      FRONTEND_ORIGIN: http://localhost:5173
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    extra_hosts:
      - "localhost:host-gateway"

volumes:
  pgdata:
  dexdata:
