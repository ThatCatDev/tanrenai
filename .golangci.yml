version: "2"

run:
  tests: true

linters:
  default: none
  enable:
    - asciicheck
    - errcheck
    - exhaustive
    - copyloopvar
    - forbidigo
    - gocyclo
    - govet
    - ineffassign
    - makezero
    - misspell
    - nakedret
    - nestif
    - nilerr
    - nlreturn
    - nolintlint
    - staticcheck
    - unconvert
    - unused
    - wastedassign
    - whitespace
  settings:
    errcheck:
      check-blank: false
    exhaustive:
      default-signifies-exhaustive: true
  exclusions:
    rules:
      - path: _test.go
        linters:
          - errcheck
    paths:
      - .*/generated/*

formatters:
  enable:
    - gofmt
    - goimports
