name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Lint gpu
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          working-directory: gpu
          args: --timeout=5m
        continue-on-error: true
      - name: Lint server
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          working-directory: server
          args: --timeout=5m
        continue-on-error: true
      - name: Lint clients/shared
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          working-directory: clients/shared
          args: --timeout=5m
        continue-on-error: true
      - name: Lint clients/cli
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          working-directory: clients/cli
          args: --timeout=5m
        continue-on-error: true
      - name: Lint infra
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          working-directory: infra
          args: --timeout=5m
        continue-on-error: true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: Run gosec
        run: |
          mkdir -p sarif-results
          for mod in gpu server infra; do
            cd "$GITHUB_WORKSPACE/$mod"
            gosec -fmt sarif -out "$GITHUB_WORKSPACE/sarif-results/${mod}.sarif" ./... || true
          done
          cd "$GITHUB_WORKSPACE/clients/shared"
          gosec -fmt sarif -out "$GITHUB_WORKSPACE/sarif-results/shared.sarif" ./... || true
          cd "$GITHUB_WORKSPACE/clients/cli"
          gosec -fmt sarif -out "$GITHUB_WORKSPACE/sarif-results/cli.sarif" ./... || true
      - name: Upload gpu SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: sarif-results/gpu.sarif
          category: gosec-gpu
      - name: Upload server SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: sarif-results/server.sarif
          category: gosec-server
      - name: Upload shared SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: sarif-results/shared.sarif
          category: gosec-shared
      - name: Upload cli SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: sarif-results/cli.sarif
          category: gosec-cli
      - name: Upload infra SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: sarif-results/infra.sarif
          category: gosec-infra

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - { name: gpu, dir: gpu }
          - { name: server, dir: server }
          - { name: shared, dir: clients/shared }
          - { name: cli, dir: clients/cli }
          - { name: infra, dir: infra }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build & vet
        run: cd ${{ matrix.module.dir }} && go build ./... && go vet ./...

      - name: Test with coverage
        run: |
          cd ${{ matrix.module.dir }}
          go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Collect coverage summary
        if: always()
        run: |
          cd ${{ matrix.module.dir }}
          if [ -f coverage.out ]; then
            total=$(go tool cover -func=coverage.out | awk '/^total:/{gsub(/%/,"",$NF); print $NF}')
            echo "$total" > "$GITHUB_WORKSPACE/${{ matrix.module.name }}-coverage-pct.txt"

            # Per-package breakdown
            go tool cover -func=coverage.out | grep -v "^total:" | awk '{
              pkg=$1; pct=$NF; gsub(/%/,"",pct);
              split(pkg, parts, "/");
              # Rebuild package path without function name
              n=length(parts);
            }' > /dev/null

            # Simpler: just get per-package totals from test output
            go test ./... -cover 2>&1 | grep -oP '(ok|FAIL|\t)\s+\S+\s+.*coverage: [0-9.]+%' | \
              sed 's/.*\t//' | awk '{print $1, $NF}' > "$GITHUB_WORKSPACE/${{ matrix.module.name }}-packages.txt" || true
          else
            echo "0" > "$GITHUB_WORKSPACE/${{ matrix.module.name }}-coverage-pct.txt"
          fi

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-${{ matrix.module.name }}
          path: |
            ${{ matrix.module.name }}-coverage-pct.txt
            ${{ matrix.module.name }}-packages.txt
          retention-days: 1

      # go-test-coverage threshold enforcement
      - name: Check coverage thresholds
        uses: vladopajic/go-test-coverage@v2
        continue-on-error: true
        with:
          config: ./.testcoverage.yml
          profile: ./${{ matrix.module.dir }}/coverage.out
          source-dir: ./${{ matrix.module.dir }}

      # On main: save baseline
      - name: Generate baseline
        if: github.ref == 'refs/heads/main'
        uses: vladopajic/go-test-coverage@v2
        continue-on-error: true
        with:
          config: ./.testcoverage.yml
          profile: ./${{ matrix.module.dir }}/coverage.out
          source-dir: ./${{ matrix.module.dir }}
          breakdown-file-name: ${{ matrix.module.name }}-breakdown.json

      - name: Upload baseline
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.module.name }}
          path: ${{ matrix.module.name }}-breakdown.json
          retention-days: 90

  coverage-comment:
    if: always() && github.event_name == 'pull_request'
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: Build comment
        run: |
          {
            echo "## Test Coverage Report"
            echo ""
            echo "| Module | Coverage |"
            echo "|--------|----------|"

            for name in gpu server shared cli infra; do
              file="${name}-coverage-pct.txt"
              if [ -f "$file" ]; then
                pct=$(cat "$file")
                if [ "$(echo "$pct >= 80" | bc -l)" -eq 1 ]; then
                  icon="🟢"
                elif [ "$(echo "$pct >= 70" | bc -l)" -eq 1 ]; then
                  icon="🟡"
                else
                  icon="🔴"
                fi
                echo "| \`$name\` | $icon ${pct}% |"
              else
                echo "| \`$name\` | ⚪ n/a |"
              fi
            done

            echo ""
            echo "> Thresholds: 70% per-package · 75% total"
            echo ""
            echo "_Updated by CI — $(date -u '+%Y-%m-%d %H:%M UTC')_"
          } > /tmp/coverage_comment.md

          cat /tmp/coverage_comment.md

      - name: Post comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage-report
          path: /tmp/coverage_comment.md

  test-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install GTK4 and libadwaita
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libgirepository1.0-dev
      - run: cd clients/desktop && go build ./... && go vet ./...
      - name: Test
        run: cd clients/desktop && go test ./...
