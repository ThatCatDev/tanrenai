name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Lint gpu
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          working-directory: gpu
          args: --timeout=5m
        continue-on-error: true
      - name: Lint server
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          working-directory: server
          args: --timeout=5m
        continue-on-error: true
      - name: Lint clients/shared
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          working-directory: clients/shared
          args: --timeout=5m
        continue-on-error: true
      - name: Lint clients/cli
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          working-directory: clients/cli
          args: --timeout=5m
        continue-on-error: true
      - name: Lint infra
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          working-directory: infra
          args: --timeout=5m
        continue-on-error: true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: Run gosec
        run: |
          mkdir -p sarif-results
          for mod in gpu server infra; do
            cd "$GITHUB_WORKSPACE/$mod"
            gosec -fmt sarif -out "$GITHUB_WORKSPACE/sarif-results/${mod}.sarif" ./... || true
          done
          cd "$GITHUB_WORKSPACE/clients/shared"
          gosec -fmt sarif -out "$GITHUB_WORKSPACE/sarif-results/shared.sarif" ./... || true
          cd "$GITHUB_WORKSPACE/clients/cli"
          gosec -fmt sarif -out "$GITHUB_WORKSPACE/sarif-results/cli.sarif" ./... || true
      - name: Upload gpu SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: sarif-results/gpu.sarif
          category: gosec-gpu
      - name: Upload server SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: sarif-results/server.sarif
          category: gosec-server
      - name: Upload shared SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: sarif-results/shared.sarif
          category: gosec-shared
      - name: Upload cli SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: sarif-results/cli.sarif
          category: gosec-cli
      - name: Upload infra SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: sarif-results/infra.sarif
          category: gosec-infra

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - { name: gpu, dir: gpu }
          - { name: server, dir: server }
          - { name: shared, dir: clients/shared }
          - { name: cli, dir: clients/cli }
          - { name: infra, dir: infra }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build & vet
        run: cd ${{ matrix.module.dir }} && go build ./... && go vet ./...

      - name: Test with coverage
        run: |
          cd ${{ matrix.module.dir }}
          go test ./... -coverprofile=coverage.out -covermode=atomic

      # On main: save baseline breakdown per module
      - name: Generate coverage baseline
        if: github.ref == 'refs/heads/main'
        uses: vladopajic/go-test-coverage@v2
        with:
          config: ./.testcoverage.yml
          profile: ./${{ matrix.module.dir }}/coverage.out
          source-dir: ./${{ matrix.module.dir }}
          breakdown-file-name: ${{ matrix.module.name }}-breakdown.json

      - name: Upload baseline artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.module.name }}
          path: ${{ matrix.module.name }}-breakdown.json
          retention-days: 90

      # On PRs: download baseline and diff
      - name: Download baseline
        if: github.event_name == 'pull_request'
        uses: dawidd6/action-download-artifact@v6
        with:
          name: coverage-${{ matrix.module.name }}
          branch: main
          workflow: ci.yml
          if_no_artifact_found: warn

      - name: Check coverage with diff (PR, baseline exists)
        if: github.event_name == 'pull_request' && hashFiles(format('{0}-breakdown.json', matrix.module.name)) != ''
        uses: vladopajic/go-test-coverage@v2
        with:
          config: ./.testcoverage.yml
          profile: ./${{ matrix.module.dir }}/coverage.out
          source-dir: ./${{ matrix.module.dir }}
          diff-base-breakdown-file-name: ${{ matrix.module.name }}-breakdown.json
          github-action-output: true
          git-token: ${{ github.token }}
          git-branch: badges

      - name: Check coverage (PR, no baseline)
        if: github.event_name == 'pull_request' && hashFiles(format('{0}-breakdown.json', matrix.module.name)) == ''
        uses: vladopajic/go-test-coverage@v2
        with:
          config: ./.testcoverage.yml
          profile: ./${{ matrix.module.dir }}/coverage.out
          source-dir: ./${{ matrix.module.dir }}
          github-action-output: true

  test-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install GTK4 and libadwaita
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libgirepository1.0-dev
      - run: cd clients/desktop && go build ./... && go vet ./...
      - name: Test
        run: cd clients/desktop && go test ./...
