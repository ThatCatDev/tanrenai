name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Lint gpu
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          working-directory: gpu
          args: --timeout=5m
        continue-on-error: true
      - name: Lint server
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          working-directory: server
          args: --timeout=5m
        continue-on-error: true
      - name: Lint clients/shared
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          working-directory: clients/shared
          args: --timeout=5m
        continue-on-error: true
      - name: Lint clients/cli
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          working-directory: clients/cli
          args: --timeout=5m
        continue-on-error: true
      - name: Lint infra
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          working-directory: infra
          args: --timeout=5m
        continue-on-error: true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: Run gosec
        run: |
          mkdir -p sarif-results
          for mod in gpu server infra; do
            cd "$GITHUB_WORKSPACE/$mod"
            gosec -fmt sarif -out "$GITHUB_WORKSPACE/sarif-results/${mod}.sarif" ./... || true
          done
          cd "$GITHUB_WORKSPACE/clients/shared"
          gosec -fmt sarif -out "$GITHUB_WORKSPACE/sarif-results/shared.sarif" ./... || true
          cd "$GITHUB_WORKSPACE/clients/cli"
          gosec -fmt sarif -out "$GITHUB_WORKSPACE/sarif-results/cli.sarif" ./... || true
      - name: Upload gpu SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: sarif-results/gpu.sarif
          category: gosec-gpu
      - name: Upload server SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: sarif-results/server.sarif
          category: gosec-server
      - name: Upload shared SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: sarif-results/shared.sarif
          category: gosec-shared
      - name: Upload cli SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: sarif-results/cli.sarif
          category: gosec-cli
      - name: Upload infra SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: sarif-results/infra.sarif
          category: gosec-infra

  gpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: cd gpu && go build ./... && go vet ./...
      - name: Test
        run: cd gpu && go test ./...

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: cd server && go build ./... && go vet ./...
      - name: Test
        run: cd server && go test ./...

  clients-shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: cd clients/shared && go build ./... && go vet ./...
      - name: Test with coverage
        run: |
          cd clients/shared
          go test ./... -coverprofile=coverage.out -covermode=atomic
          total=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $NF}' | tr -d '%')
          echo "Coverage: ${total}%"
          threshold=75
          if [ "$(echo "$total < $threshold" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${total}% is below threshold ${threshold}%"
            exit 1
          fi
      - name: Per-package coverage
        if: always()
        run: |
          cd clients/shared
          echo "### clients/shared coverage by package" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | grep -E '(^total:|^github)' | awk '{printf "%-60s %s\n", $1, $NF}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  clients-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: cd clients/cli && go build ./... && go vet ./...
      - name: Test
        run: cd clients/cli && go test ./...

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: cd infra && go build ./... && go vet ./...
      - name: Test
        run: cd infra && go test ./...

  clients-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install GTK4 and libadwaita
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libgirepository1.0-dev
      - run: cd clients/desktop && go build ./... && go vet ./...
      - name: Test
        run: cd clients/desktop && go test ./...

  changed-file-coverage:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Check coverage of changed packages
        run: |
          THRESHOLD=80
          FAILED=0

          # Map module directories to their Go module roots
          declare -A MODULE_ROOTS=(
            ["gpu"]="gpu"
            ["server"]="server"
            ["clients/shared"]="clients/shared"
            ["clients/cli"]="clients/cli"
            ["infra"]="infra"
          )

          # Get changed .go files (excluding tests and generated)
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMR origin/main...HEAD -- '*.go' | grep -v '_test.go' | grep -v '/generated/' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No Go source files changed."
            exit 0
          fi

          echo "Changed Go files:"
          echo "$CHANGED_FILES"
          echo ""

          # Collect unique packages that changed, grouped by module
          declare -A CHANGED_PKGS

          for f in $CHANGED_FILES; do
            pkg_dir=$(dirname "$f")

            # Find which module root this file belongs to
            for name in "${!MODULE_ROOTS[@]}"; do
              root="${MODULE_ROOTS[$name]}"
              if [[ "$f" == "$root/"* ]]; then
                # Get the Go package path relative to module root
                rel_dir="${pkg_dir#$root/}"
                # Skip packages with no testable logic:
                # - root packages (main.go only)
                # - pkg/api (pure struct definitions)
                if [[ "$rel_dir" == "." || "$rel_dir" == pkg/api ]]; then
                  continue
                fi
                key="$root|./$rel_dir"
                CHANGED_PKGS["$key"]=1
                break
              fi
            done
          done

          if [ ${#CHANGED_PKGS[@]} -eq 0 ]; then
            echo "No testable packages changed (only cmd/ or root packages)."
            exit 0
          fi

          echo "Checking coverage for changed packages:"
          echo ""

          # Packages that are warn-only (shown but don't block):
          # TUI code requiring a live terminal, thin CLI entry points
          WARN_PATTERNS="cmd"

          is_warn_only() {
            local pkg="$1"
            local rel="${pkg#./}"
            for pat in $WARN_PATTERNS; do
              if [[ "$rel" == "$pat" || "$rel" == "$pat"/* ]]; then
                return 0
              fi
            done
            return 1
          }

          for key in "${!CHANGED_PKGS[@]}"; do
            IFS='|' read -r mod_root pkg_path <<< "$key"
            cd "$GITHUB_WORKSPACE/$mod_root"

            warn_only=false
            if is_warn_only "$pkg_path"; then
              warn_only=true
            fi

            # Run tests for this specific package
            cov_out=$(go test "$pkg_path" -coverprofile=/dev/null -covermode=atomic 2>&1 || true)
            pct=$(echo "$cov_out" | grep -oP 'coverage: \K[0-9.]+' | head -1)

            display="${mod_root}/${pkg_path#./}"

            if [ -z "$pct" ]; then
              if [ "$warn_only" = true ]; then
                echo "  🟡 $display — no tests (warn only)"
              else
                echo "  🔴 $display — no tests"
                FAILED=1
              fi
              continue
            fi

            if [ "$(echo "$pct < $THRESHOLD" | bc -l)" -eq 1 ]; then
              if [ "$warn_only" = true ]; then
                echo "  🟡 $display — ${pct}% (warn only, threshold ${THRESHOLD}%)"
              else
                echo "  🔴 $display — ${pct}% (below ${THRESHOLD}%)"
                FAILED=1
              fi
            else
              echo "  🟢 $display — ${pct}%"
            fi

            cd "$GITHUB_WORKSPACE"
          done

          echo ""
          if [ "$FAILED" -eq 1 ]; then
            echo "::error::Some changed packages have coverage below ${THRESHOLD}%"
            exit 1
          fi
          echo "All changed packages meet the ${THRESHOLD}% coverage threshold."

  coverage-comment:
    if: always() && github.event_name == 'pull_request'
    needs: [clients-shared, clients-cli, gpu, server, infra]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Collect coverage
        run: |
          get_coverage() {
            local dir="$1"
            cd "$GITHUB_WORKSPACE/$dir"
            go test ./... -coverprofile=cov.out -covermode=atomic > /dev/null 2>&1 || true
            if [ -f cov.out ]; then
              go tool cover -func=cov.out 2>/dev/null | awk '/^total:/{gsub(/%/,"",$NF); print $NF}'
            fi
            cd "$GITHUB_WORKSPACE"
          }

          # Module roots for package lookup
          declare -A MODULE_ROOTS=(
            ["gpu"]="gpu"
            ["server"]="server"
            ["clients/shared"]="clients/shared"
            ["clients/cli"]="clients/cli"
            ["infra"]="infra"
          )

          {
            echo "## Test Coverage Report"
            echo ""
            echo "| Module | Coverage |"
            echo "|--------|----------|"

            for name in gpu server clients/shared clients/cli infra; do
              pct=$(get_coverage "$name")
              if [ -n "$pct" ]; then
                if [ "$(echo "$pct >= 80" | bc -l)" -eq 1 ]; then
                  icon="🟢"
                elif [ "$(echo "$pct >= 60" | bc -l)" -eq 1 ]; then
                  icon="🟡"
                else
                  icon="🔴"
                fi
                echo "| \`$name\` | $icon $pct% |"
              else
                echo "| \`$name\` | ⚪ n/a |"
              fi
            done

            echo ""
            echo "> 🟢 ≥80% · 🟡 ≥60% · 🔴 <60%"

            # Changed packages coverage
            CHANGED_FILES=$(git diff --name-only --diff-filter=ACMR origin/main...HEAD -- '*.go' | grep -v '_test.go' | grep -v '/generated/' || true)

            if [ -n "$CHANGED_FILES" ]; then
              declare -A CHANGED_PKGS
              for f in $CHANGED_FILES; do
                pkg_dir=$(dirname "$f")
                for name in "${!MODULE_ROOTS[@]}"; do
                  root="${MODULE_ROOTS[$name]}"
                  if [[ "$f" == "$root/"* ]]; then
                    rel_dir="${pkg_dir#$root/}"
                    # Skip only root packages and pkg/api (pure types)
                    if [[ "$rel_dir" == "." || "$rel_dir" == pkg/api ]]; then
                      continue
                    fi
                    CHANGED_PKGS["$root|./$rel_dir"]=1
                    break
                  fi
                done
              done

              if [ ${#CHANGED_PKGS[@]} -gt 0 ]; then
                echo ""
                echo "### Changed Packages (80% threshold)"
                echo ""
                echo "| Package | Coverage | Status |"
                echo "|---------|----------|--------|"

                for key in $(echo "${!CHANGED_PKGS[@]}" | tr ' ' '\n' | sort); do
                  IFS='|' read -r mod_root pkg_path <<< "$key"
                  cd "$GITHUB_WORKSPACE/$mod_root"
                  cov_out=$(go test "$pkg_path" -coverprofile=/dev/null -covermode=atomic 2>&1 || true)
                  pct=$(echo "$cov_out" | grep -oP 'coverage: \K[0-9.]+' | head -1)
                  cd "$GITHUB_WORKSPACE"

                  display="${mod_root}/${pkg_path#./}"
                  rel="${pkg_path#./}"

                  # cmd/ packages are warn-only (TUI/CLI code)
                  is_cmd=false
                  if [[ "$rel" == "cmd" || "$rel" == cmd/* ]]; then
                    is_cmd=true
                  fi

                  if [ -z "$pct" ]; then
                    if [ "$is_cmd" = true ]; then
                      echo "| \`$display\` | — | 🟡 warn (TUI) |"
                    else
                      echo "| \`$display\` | — | 🔴 no tests |"
                    fi
                  elif [ "$(echo "$pct < 80" | bc -l)" -eq 1 ]; then
                    if [ "$is_cmd" = true ]; then
                      echo "| \`$display\` | ${pct}% | 🟡 warn (TUI) |"
                    else
                      echo "| \`$display\` | ${pct}% | 🔴 below 80% |"
                    fi
                  else
                    echo "| \`$display\` | ${pct}% | 🟢 |"
                  fi
                done
              fi
            fi

            echo ""
            echo "_Updated by CI — $(date -u '+%Y-%m-%d %H:%M UTC')_"
          } > /tmp/coverage_comment.md

          cat /tmp/coverage_comment.md

      - name: Post or update PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage-report
          path: /tmp/coverage_comment.md
