name: Docker

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'gpu/**'
  workflow_dispatch:

env:
  REGISTRY: harbor.floret.dev
  IMAGE_BASE: harbor.floret.dev/tanrenai

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/server:latest
            ${{ env.IMAGE_BASE }}/server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push server-tailscale
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/docker/Dockerfile.tailscale
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/server-tailscale:latest
            ${{ env.IMAGE_BASE }}/server-tailscale:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  gpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push gpu
        uses: docker/build-push-action@v6
        with:
          context: .
          file: gpu/docker/Dockerfile
          push: true
          tags: |
            thatcatdev/tanrenai-gpu:latest
            thatcatdev/tanrenai-gpu:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
