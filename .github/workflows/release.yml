name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  LLAMA_CPP_VERSION: "b9274"

jobs:
  # ─── Determine version via semantic-release ───────────────────────
  release:
    runs-on: ubuntu-latest
    outputs:
      new_release: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run semantic-release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Build CLI + llama-server bundle ──────────────────────────────
  build-cli:
    needs: release
    if: needs.release.outputs.new_release == 'true'
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            llama_asset: "llama-{V}-bin-ubuntu-x64.tar.gz"
            llama_bin_path: "llama-{V}/llama-server"
            ext: ""
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
            llama_asset: ""
            llama_bin_path: ""
            ext: ""
          - goos: darwin
            goarch: amd64
            runner: ubuntu-latest
            llama_asset: "llama-{V}-bin-macos-x64.tar.gz"
            llama_bin_path: "llama-{V}/llama-server"
            ext: ""
          - goos: darwin
            goarch: arm64
            runner: ubuntu-latest
            llama_asset: "llama-{V}-bin-macos-arm64.tar.gz"
            llama_bin_path: "llama-{V}/llama-server"
            ext: ""
          - goos: windows
            goarch: amd64
            runner: ubuntu-latest
            llama_asset: "llama-{V}-bin-win-cuda-12.4-x64.zip"
            llama_bin_path: "llama-server.exe"
            llama_cudart: "cudart-llama-bin-win-cuda-12.4-x64.zip"
            ext: ".exe"
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          cd clients/cli
          go build -trimpath \
            -ldflags "-s -w -X github.com/ThatCatDev/tanrenai/client/cmd.Version=v${VERSION} -X github.com/ThatCatDev/tanrenai/client/cmd.CommitSHA=${GITHUB_SHA::8}" \
            -o "tanrenai-cli${{ matrix.ext }}" .

      - name: Download llama-server
        if: matrix.llama_asset != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd clients/cli
          V="${LLAMA_CPP_VERSION}"
          ASSET="${{ matrix.llama_asset }}"
          ASSET="${ASSET//\{V\}/$V}"
          BIN_PATH="${{ matrix.llama_bin_path }}"
          BIN_PATH="${BIN_PATH//\{V\}/$V}"

          echo "Downloading ${ASSET}..."
          gh release download "${V}" --repo ggerganov/llama.cpp --pattern "${ASSET}" --dir .

          mkdir -p bin
          if [[ "${ASSET}" == *.tar.gz ]]; then
            tar xzf "${ASSET}"
            LLAMA_DIR=$(dirname "${BIN_PATH}")
            mv "${BIN_PATH}" bin/llama-server
            # Copy shared libraries (.so for Linux, .dylib for macOS)
            cp "${LLAMA_DIR}"/*.so* bin/ 2>/dev/null || true
            cp "${LLAMA_DIR}"/*.dylib bin/ 2>/dev/null || true
          else
            unzip -j "${ASSET}" "${BIN_PATH}" -d bin/
          fi
          chmod +x bin/* 2>/dev/null || true

          # For Windows CUDA: also download cudart DLLs
          CUDART="${{ matrix.llama_cudart }}"
          if [ -n "${CUDART}" ]; then
            echo "Downloading CUDA runtime DLLs..."
            gh release download "${V}" --repo ggerganov/llama.cpp --pattern "${CUDART}" --dir .
            unzip -o "${CUDART}" -d bin/
            # Also extract all DLLs from the main CUDA archive
            unzip -oj "${ASSET}" '*.dll' -d bin/ 2>/dev/null || true
          fi

          rm -rf "${ASSET}" "${CUDART}" "llama-${V}" 2>/dev/null || true
          echo "Bundled llama-server files:"
          ls -lh bin/

          # Fail the build if llama-server is missing
          if [ ! -f bin/llama-server ] && [ ! -f bin/llama-server.exe ]; then
            echo "ERROR: llama-server binary not found in bin/"
            exit 1
          fi

      - name: Package
        run: |
          cd clients/cli
          GOOS="${{ matrix.goos }}"
          GOARCH="${{ matrix.goarch }}"
          NAME="tanrenai-cli-${GOOS}-${GOARCH}"
          mkdir -p "${NAME}/bin"
          cp "tanrenai-cli${{ matrix.ext }}" "${NAME}/"
          if [ -d bin ] && [ "$(ls -A bin)" ]; then
            cp -r bin/* "${NAME}/bin/"
          fi
          if [ "${GOOS}" = "windows" ]; then
            zip -r "${NAME}.zip" "${NAME}"
          else
            tar czf "${NAME}.tar.gz" "${NAME}"
          fi

      - name: Upload archive to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd clients/cli
          GOOS="${{ matrix.goos }}"
          GOARCH="${{ matrix.goarch }}"
          NAME="tanrenai-cli-${GOOS}-${GOARCH}"
          if [ "${GOOS}" = "windows" ]; then
            gh release upload "v${VERSION}" "${NAME}.zip" --clobber
          else
            gh release upload "v${VERSION}" "${NAME}.tar.gz" --clobber
          fi

      - name: Upload Windows build for installer
        if: matrix.goos == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: cli-windows-build
          path: clients/cli/tanrenai-cli-windows-amd64/

  # ─── Build CLI Windows Installer ─────────────────────────────────
  build-cli-installer:
    needs: [release, build-cli]
    if: needs.release.outputs.new_release == 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install NSIS
        shell: powershell
        run: choco install nsis -y

      - name: Download CLI build
        uses: actions/download-artifact@v4
        with:
          name: cli-windows-build
          path: staging/

      - name: Prepare NSIS scripts
        shell: bash
        run: |
          cp installers/cli.nsi staging/
          cp installers/EnvVarUpdate.nsh staging/
          cp resources/logo.ico staging/

      - name: Run NSIS
        shell: powershell
        run: |
          $env:PATH = "C:\Program Files (x86)\NSIS;$env:PATH"
          makensis /DVERSION="v${{ env.VERSION }}" staging\cli.nsi

      - name: Upload installer to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${VERSION}" staging/tanrenai-cli-windows-amd64-setup.exe --clobber

  # ─── Build .deb package for Linux ────────────────────────────────
  build-deb:
    needs: [release, build-cli]
    if: needs.release.outputs.new_release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Download CLI linux-amd64 archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSET="tanrenai-cli-linux-amd64.tar.gz"
          gh release download "v${VERSION}" --repo "${GITHUB_REPOSITORY}" --pattern "${ASSET}" --dir .
          tar xzf "${ASSET}"

      - name: Build .deb
        run: |
          PKG="tanrenai_${VERSION}_amd64"
          mkdir -p "${PKG}/DEBIAN"
          mkdir -p "${PKG}/usr/bin"
          mkdir -p "${PKG}/usr/share/tanrenai/bin"

          # Control file
          cat > "${PKG}/DEBIAN/control" << EOF
          Package: tanrenai
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: ThatCatDev <dev@tanrenai.com>
          Homepage: https://github.com/ThatCatDev/tanrenai
          Description: Local AI assistant with agentic tool use, context windowing, and memory/RAG
           Tanrenai (鍛錬AI) is a local AI assistant that runs GGUF models with
           tool calling, persistent memory, and a built-in inference engine.
          EOF
          # Remove leading spaces (heredoc indentation)
          sed -i 's/^          //' "${PKG}/DEBIAN/control"

          # Copy files
          cp tanrenai-cli-linux-amd64/tanrenai-cli "${PKG}/usr/bin/tanrenai"
          chmod 755 "${PKG}/usr/bin/tanrenai"

          if [ -d tanrenai-cli-linux-amd64/bin ] && [ "$(ls -A tanrenai-cli-linux-amd64/bin)" ]; then
            cp tanrenai-cli-linux-amd64/bin/* "${PKG}/usr/share/tanrenai/bin/"
            chmod 755 "${PKG}/usr/share/tanrenai/bin/"*
          fi

          dpkg-deb --build "${PKG}"
          mv "${PKG}.deb" "tanrenai-${VERSION}-amd64.deb"

      - name: Upload .deb to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${VERSION}" "tanrenai-${VERSION}-amd64.deb" --clobber

  # ─── Build Desktop — Linux ───────────────────────────────────────
  build-desktop-linux:
    needs: release
    if: needs.release.outputs.new_release == 'true'
    strategy:
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install GTK4 and libadwaita
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libgirepository1.0-dev

      - name: Build desktop
        env:
          CGO_ENABLED: "1"
          GOARCH: ${{ matrix.goarch }}
        run: |
          cd clients/desktop
          go build -trimpath \
            -ldflags "-s -w -X main.Version=v${VERSION} -X main.CommitSHA=${GITHUB_SHA::8}" \
            -o tanrenai-desktop .

      - name: Download llama-server
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${LLAMA_CPP_VERSION}"
          ASSET="llama-${V}-bin-ubuntu-x64.tar.gz"
          gh release download "${V}" --repo ggerganov/llama.cpp --pattern "${ASSET}" --dir .
          mkdir -p clients/desktop/bin
          tar xzf "${ASSET}" "llama-${V}/llama-server"
          mv "llama-${V}/llama-server" clients/desktop/bin/
          chmod +x clients/desktop/bin/llama-server
          rm -f "${ASSET}"

      - name: Package
        run: |
          cd clients/desktop
          NAME="tanrenai-desktop-linux-${{ matrix.goarch }}"
          mkdir -p "${NAME}/bin"
          cp tanrenai-desktop "${NAME}/"
          cp bin/llama-server "${NAME}/bin/"
          tar czf "${NAME}.tar.gz" "${NAME}"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd clients/desktop
          NAME="tanrenai-desktop-linux-${{ matrix.goarch }}"
          gh release upload "v${VERSION}" "${NAME}.tar.gz" --clobber

  # ─── Build Desktop — macOS ───────────────────────────────────────
  build-desktop-macos:
    needs: release
    if: needs.release.outputs.new_release == 'true'
    strategy:
      matrix:
        include:
          - goarch: arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install GTK4 and libadwaita
        run: brew install gtk4 libadwaita pkg-config gobject-introspection

      - name: Build desktop
        env:
          CGO_ENABLED: "1"
          GOARCH: ${{ matrix.goarch }}
        run: |
          cd clients/desktop
          go build -trimpath \
            -ldflags "-s -w -X main.Version=v${VERSION} -X main.CommitSHA=${GITHUB_SHA::8}" \
            -o tanrenai-desktop .

      - name: Download llama-server
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${LLAMA_CPP_VERSION}"
          ASSET="llama-${V}-bin-macos-arm64.tar.gz"
          gh release download "${V}" --repo ggerganov/llama.cpp --pattern "${ASSET}" --dir .
          mkdir -p clients/desktop/bin
          tar xzf "${ASSET}"
          mv "llama-${V}/llama-server" clients/desktop/bin/
          # Also copy shared libraries (.dylib)
          cp llama-${V}/*.dylib clients/desktop/bin/ 2>/dev/null || true
          chmod +x clients/desktop/bin/*
          rm -rf "${ASSET}" "llama-${V}"

      - name: Create macOS app bundle
        run: |
          cd clients/desktop
          ARCH="${{ matrix.goarch }}"
          APP="TanrenAI.app"
          mkdir -p "${APP}/Contents/MacOS"
          mkdir -p "${APP}/Contents/MacOS/bin"
          mkdir -p "${APP}/Contents/Resources"

          cp tanrenai-desktop "${APP}/Contents/MacOS/tanrenai-desktop"
          cp bin/* "${APP}/Contents/MacOS/bin/"

          cat > "${APP}/Contents/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>tanrenai-desktop</string>
            <key>CFBundleIdentifier</key>
            <string>com.tanrenai.desktop</string>
            <key>CFBundleName</key>
            <string>TanrenAI</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>VERSION_PLACEHOLDER</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST

          sed -i '' "s/VERSION_PLACEHOLDER/v${VERSION}/" "${APP}/Contents/Info.plist"

          NAME="tanrenai-desktop-macos-${ARCH}"
          mkdir -p "${NAME}"
          cp -R "${APP}" "${NAME}/"
          tar czf "${NAME}.tar.gz" "${NAME}"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd clients/desktop
          NAME="tanrenai-desktop-macos-${{ matrix.goarch }}"
          gh release upload "v${VERSION}" "${NAME}.tar.gz" --clobber

  # ─── Build Desktop — Windows (GTK4 + DLL bundling) ───────────────
  build-desktop-windows:
    needs: release
    if: needs.release.outputs.new_release == 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.release.outputs.version }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-gobject-introspection
            mingw-w64-ucrt-x86_64-go
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-pkg-config
            zip
            unzip

      - name: Build desktop
        run: |
          cd clients/desktop
          export CGO_ENABLED=1
          export GOARCH=amd64
          go build -trimpath \
            -ldflags "-s -w -H windowsgui -X main.Version=v${VERSION} -X main.CommitSHA=${GITHUB_SHA::8}" \
            -o tanrenai-desktop.exe .

      - name: Download llama-server
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${LLAMA_CPP_VERSION}"
          ASSET="llama-${V}-bin-win-cuda-12.4-x64.zip"
          CUDART="cudart-llama-bin-win-cuda-12.4-x64.zip"

          gh release download "${V}" --repo ggerganov/llama.cpp --pattern "${ASSET}" --dir .
          gh release download "${V}" --repo ggerganov/llama.cpp --pattern "${CUDART}" --dir .

          mkdir -p clients/desktop/llama-bin
          unzip -j "${ASSET}" "llama-server.exe" -d clients/desktop/llama-bin/
          unzip -oj "${ASSET}" '*.dll' -d clients/desktop/llama-bin/ 2>/dev/null || true
          unzip -o "${CUDART}" -d clients/desktop/llama-bin/

          rm -f "${ASSET}" "${CUDART}"
          echo "llama-server files:"
          ls -lh clients/desktop/llama-bin/

      - name: Bundle DLLs
        run: |
          cd clients/desktop
          mkdir -p bundle/bin

          # Copy the executable
          cp tanrenai-desktop.exe bundle/

          # Copy llama-server + CUDA DLLs into bin/
          cp llama-bin/* bundle/bin/

          # Find and copy all required GTK DLLs from UCRT64
          ldd tanrenai-desktop.exe | grep -i ucrt64 | awk '{print $3}' | while read dll; do
            cp "$dll" bundle/
          done

          # Copy GLib schemas (required for GTK4)
          mkdir -p bundle/share/glib-2.0/schemas
          cp /ucrt64/share/glib-2.0/schemas/gschemas.compiled bundle/share/glib-2.0/schemas/ 2>/dev/null || true

          # Copy GDK pixbuf loaders
          mkdir -p bundle/lib/gdk-pixbuf-2.0
          cp -r /ucrt64/lib/gdk-pixbuf-2.0/* bundle/lib/gdk-pixbuf-2.0/ 2>/dev/null || true

          # Copy Adwaita icons (essential subset)
          mkdir -p bundle/share/icons
          cp -r /ucrt64/share/icons/Adwaita bundle/share/icons/ 2>/dev/null || true
          cp -r /ucrt64/share/icons/hicolor bundle/share/icons/ 2>/dev/null || true

          # Copy GTK4 settings schemas
          if [ -d /ucrt64/share/gtk-4.0 ]; then
            mkdir -p bundle/share/gtk-4.0
            cp -r /ucrt64/share/gtk-4.0/* bundle/share/gtk-4.0/ 2>/dev/null || true
          fi

          echo "Bundle contents:"
          find bundle -type f | head -50
          echo "Total files: $(find bundle -type f | wc -l)"
          echo "Total size: $(du -sh bundle | cut -f1)"

      - name: Package zip
        run: |
          cd clients/desktop
          NAME="tanrenai-desktop-windows-amd64"
          mv bundle "${NAME}"
          zip -r "${NAME}.zip" "${NAME}"

      - name: Install NSIS
        shell: powershell
        run: choco install nsis -y

      - name: Build NSIS installer
        shell: bash
        run: |
          cd clients/desktop
          NAME="tanrenai-desktop-windows-amd64"
          cp ../../installers/desktop.nsi "${NAME}/"
          cp ../../installers/EnvVarUpdate.nsh "${NAME}/"
          cp ../../resources/logo.ico "${NAME}/"

      - name: Run NSIS
        shell: powershell
        run: |
          $env:PATH = "C:\Program Files (x86)\NSIS;$env:PATH"
          makensis /DVERSION="v${{ env.VERSION }}" clients\desktop\tanrenai-desktop-windows-amd64\desktop.nsi

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd clients/desktop
          NAME="tanrenai-desktop-windows-amd64"
          gh release upload "v${VERSION}" "${NAME}.zip" --clobber
          gh release upload "v${VERSION}" "${NAME}/tanrenai-desktop-windows-amd64-setup.exe" --clobber
